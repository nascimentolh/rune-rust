[package]
name = "rune-rust"
version = "0.1.0"
edition = "2021"
description = "A readable Rust port of the build-727 game client, with a cache and login server"
license = "MIT"

[dependencies]
macroquad = "0.4"
bzip2 = "0.6"
flate2 = "1"
crc32fast = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
whirlpool = "0.11.0"
num-bigint = "0.5.1"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zune-jpeg = "0.5"
zune-core = "0.5"
display-info = "0.5"

[profile.dev.package."*"]
opt-level = 2

# Standard of the codebase: unused or dead code fails the build, and clippy's
# full default set must be clean (`cargo clippy --all-targets`).
[lints.rust]
unused = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
